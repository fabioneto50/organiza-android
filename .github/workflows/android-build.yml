name: Build SALU FLOW Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply SALU FLOW v0.5 final source
        shell: bash
        run: |
          set -euo pipefail
          cat .source-bundles/v05-final.part.* | tr -d '\r\n' > /tmp/salu-flow-v05.b64
          base64 --decode /tmp/salu-flow-v05.b64 > /tmp/salu-flow-v05.tar.xz
          tar -tJf /tmp/salu-flow-v05.tar.xz >/dev/null
          tar -xJf /tmp/salu-flow-v05.tar.xz -C .

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "platform-tools"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SALU-FLOW-v0.5-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
