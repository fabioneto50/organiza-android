name: Build Organiza Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand pending source bundle
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=.source-bundles/organiza-v0.4.zip
          if compgen -G '.source-bundles/organiza-v0.4.b64.*' > /dev/null; then
            echo 'Reconstructing v0.4 bundle from text chunks'
            cat .source-bundles/organiza-v0.4.b64.* | base64 --decode > /tmp/organiza-v0.4.zip
            unzip -t /tmp/organiza-v0.4.zip >/dev/null
            unzip -oq /tmp/organiza-v0.4.zip -d .
          elif [ -f "$BUNDLE" ]; then
            echo "Expanding $BUNDLE for validation"
            unzip -oq "$BUNDLE" -d .
          else
            echo 'No pending source bundle'
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "platform-tools"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Organiza-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Materialize validated source bundle on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (hashFiles('.source-bundles/organiza-v0.4.zip') != '' || hashFiles('.source-bundles/organiza-v0.4.b64.*') != '')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app CHANGELOG.md .github/workflows/android-build.yml
          git rm -f --ignore-unmatch .source-bundles/organiza-v0.4.zip .source-bundles/organiza-v0.4.b64.*
          if git diff --cached --quiet; then
            echo 'Nothing to materialize.'
          else
            git commit -m 'Materialize Organiza v0.4 validated source'
            git push origin HEAD:main
          fi
